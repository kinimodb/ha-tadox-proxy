# Picked up for `python -m pytest tests_ha/` – kept separate from the
# pyproject.toml settings so the HA-free suite in tests/ does not need
# pytest-asyncio installed.
[pytest]
# pytest-homeassistant asks for this: Home Assistant must set up its own
# httpx before respx is imported.  Without respx the option does nothing.
addopts = -p no:respx
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
