name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v

  ha-integration:
    name: HA integration (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported version (hacs.json "homeassistant").
          - homeassistant: "2026.3.1"
            harness: "pytest-homeassistant-custom-component==0.13.317"
          # Newest version the suite has been verified against.  From Home
          # Assistant 2026.11 the test harness ships with Home Assistant as
          # pytest-homeassistant, under the same version number;
          # pytest-homeassistant-custom-component ended with 2026.10.
          - homeassistant: "2026.11.1"
            harness: "pytest-homeassistant==2026.11.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      - name: Install dependencies
        run: pip install "${{ matrix.harness }}"

      - name: Run HA integration tests
        run: python -m pytest tests_ha/ -v
